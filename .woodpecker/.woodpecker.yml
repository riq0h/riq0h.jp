clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      recursive: true

steps:
  build:
    image: klakegg/hugo:ext-alpine
    commands:
      - hugo -D
  deploy:
    image: appleboy/drone-scp
    secrets: [HOST, SSH, PORT]
    settings:
      host:
        from_secret: HOST
      username: riq0h
      key:
        from_secret: SSH
      port: 
        from_secret: PORT
      target: /var/www/html/
      source:
        - public
      overwrite: true
