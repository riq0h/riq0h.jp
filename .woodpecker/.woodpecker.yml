clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      recursive: true
      partial: false
      depth: 1

steps:
  build:
    image: hugomods/hugo:base
    commands:
      - hugo --noBuildLock

  fonts:
    image: hugomods/hugo:base
    commands:
      - apk add --no-cache python3 py3-pip curl
      - pip install --break-system-packages --quiet fonttools brotli
      - python3 ./scripts/subset_fonts.py

  ogimages:
    image: hugomods/hugo:base
    commands:
      - apk add --no-cache chromium python3 imagemagick font-noto
      - sh ./scripts/generate-og-images.sh

  deploy:
    image: drillster/drone-rsync
    settings:
      hosts:
        from_secret: HOST
      user:
        from_secret: USER
      key:
        from_secret: SSH
      port:
        from_secret: PORT
      source: public
      target: /var/www/html
