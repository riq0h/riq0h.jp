clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      recursive: true

steps:
  build:
    image: floryn90/hugo:0.136.3-alpine
    commands:
      - hugo --noBuildLock
  deploy:
    image: drillster/drone-rsync
    secrets: [USER, HOST, SSH, PORT]
    settings:
      hosts:
        from_secret: HOST
      user:
        from_secret: USER
      key:
        from_secret: SSH
      port:
        from_secret: PORT
      source: public
      target: /var/www/html
