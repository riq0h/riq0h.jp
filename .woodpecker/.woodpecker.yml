clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      recursive: true

steps:
  build:
    image: klakegg/hugo:ext-alpine
    commands:
      - hugo -D
  deploy:
    image: drillster/drone-rsync
    secrets: [HOTS, SSH, PORT]
    settings:
      hosts:
        from_secret: HOST
      user: riq0h
      key:
        from_secret: SSH
      port:
        from_secret: PORT
      source: public
      target: /var/www/html
