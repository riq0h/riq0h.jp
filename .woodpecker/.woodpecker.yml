clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      recursive: true

steps:
  build:
    image: hugomods/hugo:base
    commands:
      - hugo --noBuildLock

  deploy:
    image: drillster/drone-rsync
    environment:
      USER:
        from_secret: USER
      HOST:
        from_secret: HOST
      SSH:
        from_secret: SSH
      PORT:
        from_secret: PORT
    settings:
      hosts:
        from_secret: HOST
      user:
        from_secret: USER
      key:
        from_secret: SSH
      port:
        from_secret: PORT
      source: public
      target: /var/www/html
