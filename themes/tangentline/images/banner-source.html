<!doctype html>
<!--
  88x31バナーリンク用ソース。352x124(4倍)でレンダリングし、Box法で
  352x124(配布用)と88x31(実寸参考)へ縮小する。
  font-size: 1px * 1.333^7 (完全4度7段) * 4倍
  タイトル-罫線間ギャップ: 1px * 1.25^5 (長3度5段) * 4倍 ≒ 12.207
  罫線yは上記ギャップから逆算した値(81.73)をピクセル行境界回避のため81.5へ丸め
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<link href="https://fonts.bunny.net/css?family=noto-serif-jp:300,400,500,700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f0f0f0; padding: 40px; }
  .banner {
    position: relative;
    width: 352px;
    height: 124px;
    background: #fff;
    font-family: "Noto Serif JP", serif;
  }
  svg { position: absolute; inset: 0; }
  .title {
    position: absolute;
    left: 0; right: 0; top: 32.37px;
    text-align: center;
    font-size: 29.9138px;
    font-weight: 300;
    letter-spacing: .12em;
    color: #080808;
    white-space: nowrap;
  }
  .title .hang { margin-right: calc(-1em - .24em); }
</style>
</head>
<body>

<div class="banner">
  <svg width="352" height="124" viewBox="0 0 352 124">
    <rect x="0.4" y="0.4" width="351.2" height="123.2" fill="none" stroke="#080808" stroke-width="0.8"/>
    <line x1="36" y1="81.5" x2="316" y2="81.5" stroke="#080808" stroke-width="0.8"/>
  </svg>
  <div class="title">点と接線<span class="hang">。</span></div>
</div>

</body>
</html>
