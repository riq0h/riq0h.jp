baseURL = "https://riq0h.jp/"
locale = "ja"
defaultContentLanguage = "ja"
hasCJKLanguage = true
title = "点と接線。"
theme = "tangentline"
copyright = "©2011 辻谷陸王"
enableRobotsTXT = true
summaryLength = 200
capitalizeListTitles = false
pluralizeListTitles = false

[pagination]
pagerSize = 4

[taxonomies]
tag = "tags"

[permalinks]
post = "/:year/:month/:day/:15:04:05/"

[services.rss]
limit = 8

[outputFormats.ogcard]
mediaType = "text/html"
baseName = "ogcard"
isPlainText = false
notAlternative = true

[outputs]
home = ["html", "rss", "ogcard"]
section = ["html", "ogcard"]
taxonomy = ["html", "ogcard"]
term = ["html", "ogcard"]
page = ["html", "ogcard"]

[markup]
  [markup.goldmark.renderer]
  unsafe = true

  # 段落内の改行が和文どうしの間で半角スペースになるのを止める。
  # Markdownの改行は英語では単語区切りとして正しいが、日本語では
  # 不要な空きになる。閉じタグ直後の改行には効かない(前が要素境界で
  # 東アジア文字と判定されないため)。
  [markup.goldmark.extensions.cjk]
  enable = true
  eastAsianLineBreaks = true
  eastAsianLineBreaksStyle = 'simple'

  [markup.highlight]
  codeFences = true
  guessSyntax = true
  hl_Lines = ""
  lineNoStart = 1
  lineNos = false
  lineNumbersInTable = false
  noClasses = false
  tabWidth = 2

[params.footer]

[[params.footer.links]]
name = "Fediverse"
url = "https://letter.mystech.ink/@riq0h"
me = true

[[params.footer.links]]
name = "メール"
url = "mailto:mail@riq0h.jp"

[[params.footer.links]]
name = "RSS"
url = "/index.xml"

[[params.footer.links]]
name = "小説"
url = "/tags/novel"
